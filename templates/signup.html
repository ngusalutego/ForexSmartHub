{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div style="max-width:520px;margin:auto;">
  <h1 style="margin-bottom:10px;">Create Account</h1>
  <p style="margin-bottom:20px;">Jiunge na Forex Smart Hub uanze kujifunza.</p>
  <form method="POST" id="signupForm">
    {{ csrf() }}
    <label>Full Name</label>
    <input type="text" name="name" maxlength="80" required>
    <label>Email</label>
    <input type="email" name="email" placeholder="you@example.com" required autocomplete="username">
    <label>Password</label>
    <input type="password" name="password" minlength="6" placeholder="Angalau herufi 6" required autocomplete="new-password">
    <label>Confirm Password</label>
    <input type="password" name="confirm_password" minlength="6" required autocomplete="new-password">
    <button type="submit" class="btn" style="margin-top:20px;">Create Account</button>
  </form>
  <p style="margin-top:20px;">Una akaunti tayari? <a href="{{ url_for('login') }}">Login</a></p>
</div>
<script>
document.getElementById("signupForm").addEventListener("submit", function (e) {
  if (this.password.value !== this.confirm_password.value) { e.preventDefault(); alert("Nenosiri halifanani."); }
});
</script>
{% endblock %}
