{% extends "base.html" %}
{% from "_macros.html" import csrf, avatar with context %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="center-box">
  <div class="box">
    <h1 style="margin-bottom:14px;">✏️ Edit Profile</h1>
    <div style="margin-bottom:10px;">{{ avatar(user, True) }}</div>
    <form method="POST" enctype="multipart/form-data" class="plain-form">
      {{ csrf() }}
      <label>Name</label><input type="text" name="name" maxlength="80" value="{{ user['name'] }}" required>
      <label>Bio</label><textarea name="bio" maxlength="500" placeholder="Jielezee...">{{ user['bio'] }}</textarea>
      <label>Profile Picture (hadi 5 MB)</label><input type="file" name="profile_image" accept="image/*">
      <button class="btn" style="margin-top:18px;" type="submit">Save Profile</button>
    </form>
  </div>
</div>
{% endblock %}
