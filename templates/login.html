{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width:500px;margin:auto;">
  <h1 style="margin-bottom:10px;">🔐 Login</h1>
  <p style="margin-bottom:20px;">Ingia kwenye akaunti yako ya Forex Smart Hub.</p>
  <form method="POST">
    {{ csrf() }}
    <label>Email</label>
    <input type="email" name="email" placeholder="you@example.com" required autocomplete="username">
    <label>Password</label>
    <input type="password" name="password" required autocomplete="current-password">
    <button type="submit" class="btn" style="margin-top:20px;">Login</button>
  </form>
  <p style="margin-top:20px;">Huna akaunti? <a href="{{ url_for('signup') }}">Fungua akaunti</a></p>
</div>
{% endblock %}
